name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write    # Release 需要写权限，默认是只读

jobs:
  roothide:
    # macOS runner 在这个账号上分配不到（job 秒 cancelled），
    # 所以走 Linux + theos 官方 Linux 工具链，编出来的 Mach-O 完全一样。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl zip unzip git \
            libxml2 libtinfo6 dpkg-dev xz-utils ca-certificates
          # Ubuntu 仓库里没有 ldid，用 Procursus 官方 linux 二进制
          curl -sL -o /tmp/ldid \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus8/ldid_linux_x86_64
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid
          ldid -v 2>&1 | head -2

      - name: 装 RootHide 版 Theos
        run: |
          git clone --recursive --depth 1 --shallow-submodules \
            https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: 装 iOS 工具链
        run: |
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz \
            | tar -xJ -C "$THEOS/toolchain/"
          # clang 19 的包里缺 libc++ 的 __config_site，补一个最小的
          CXXDIR="$THEOS/toolchain/linux/iphone/include/c++/v1"
          if [ -d "$CXXDIR" ] && [ ! -f "$CXXDIR/__config_site" ]; then
            printf '#define _LIBCPP_ABI_VERSION 1\n#define _LIBCPP_ABI_NAMESPACE __1\n' > "$CXXDIR/__config_site"
            echo "created __config_site"
          fi
          "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -2
          ls "$THEOS/toolchain/linux/iphone/bin" | head

      - name: 装 iOS SDK
        run: |
          # theos 自带空的 sdks 目录，不能直接 clone 进去；
          # 用 sparse checkout 只拿 16.5（整库一个多 G）
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git /tmp/sdks-repo
          cd /tmp/sdks-repo
          git sparse-checkout set iPhoneOS16.5.sdk
          mv iPhoneOS*.sdk "$THEOS/sdks/"
          ls "$THEOS/sdks"

      - name: 编译 roothide deb
        run: |
          export PATH="$THEOS/bin:$PATH"
          chmod 755 layout/DEBIAN/postinst
          set -o pipefail
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee /tmp/build.log | tail -120
          echo "--- packages ---"
          ls -l packages/
          echo "--- dylib 架构 ---"
          rm -rf /tmp/chk && mkdir -p /tmp/chk && dpkg-deb -R packages/*.deb /tmp/chk
          file /tmp/chk/Library/MobileSubstrate/DynamicLibraries/ThermalFuse.dylib || true
          dpkg-deb -c packages/*.deb

      - name: 诊断（失败时打印预处理结果）
        if: failure()
        run: |
          echo "=== .theos 中间文件 ==="
          find .theos -name "*Tweak*" -o -name "*.mm" | head -20
          for f in $(find .theos -name "Tweak*" -size -2M | head -5); do
            echo "===== $f ====="
            sed -n '1,40p' "$f"
            echo "  ... 关键字行 ..."
            grep -n "%hook\|%end\|_logos_method\|_logos_orig\|%ctor" "$f" | head -40
          done

      - name: 传成品
        uses: actions/upload-artifact@v4
        with:
          name: ThermalFuse-deb
          path: packages/*.deb

      - name: 打 tag 就发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
