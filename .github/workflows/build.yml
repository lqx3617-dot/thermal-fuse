name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  roothide:
    # macOS runner 在这个账号上分配不到（job 秒 cancelled），
    # 所以走 Linux + theos 官方 Linux 工具链，编出来的 Mach-O 完全一样。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl zip unzip git \
            libxml2 libtinfo5 dpkg-dev xz-utils ca-certificates
          # Ubuntu 仓库里没有 ldid，用 Procursus 官方 linux 二进制
          curl -sL -o /tmp/ldid \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus8/ldid_linux_x86_64
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid
          ldid -v 2>&1 | head -2

      - name: 装 RootHide 版 Theos
        run: |
          git clone --recursive --depth 1 --shallow-submodules \
            https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: 装 iOS 工具链
        run: |
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJ -C "$THEOS/toolchain/"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -2
          ls "$THEOS/toolchain/linux/iphone/bin" | head

      - name: 装 iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          ls "$THEOS/sdks"

      - name: 编译 roothide deb
        run: |
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1 | tail -40
          echo "--- packages ---"
          ls -l packages/
          dpkg-deb -c packages/*.deb

      - name: 传成品
        uses: actions/upload-artifact@v4
        with:
          name: ThermalFuse-deb
          path: packages/*.deb

      - name: 打 tag 就发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
